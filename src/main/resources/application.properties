spring.application.name=coin-change

# Number of coins of each type the machine starts with
coin-change.initial-coin-count=100

# 5.5 is rejected instead of being cut to 5
spring.jackson.deserialization.accept-float-as-int=false
# "5" (a string) is rejected instead of being converted to the number 5
spring.jackson.mapper.allow-coercion-of-scalars=false
